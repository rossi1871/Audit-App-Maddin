name: Umzug prüfen
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://go-range.de/audit/api/move.php; O=https://audit-maddin.netlify.app; ID=0123456789abcdef0123456789abcdef
          echo "== OPTIONS"; curl -sS -m 30 -i -X OPTIONS -H "Origin: $O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "$A?a=put&id=$ID&n=0&of=1" | head -20
          head -c 900000 /dev/urandom > b.bin
          echo "== POST"; curl -sS -m 60 -i -w "\ntime=%{time_total}\n" -H "Origin: $O" -H "Content-Type: application/octet-stream" --data-binary @b.bin "$A?a=put&id=$ID&n=0&of=1" | grep -iv "^date\|^server" | head -20
          echo "== INFO"; curl -sS -m 30 "$A?a=info&id=$ID"; echo
          echo "== DEL"; curl -sS -m 30 -X POST "$A?a=del&id=$ID"; echo
          echo "== NETLIFY"; curl -sS -m 30 -o /dev/null -w "%{http_code}\n" $O/
