 S.obs.forEach(o=>(o.t||'').split(/[^A-Za-zÄÖÜäöüß0-9]+/).forEach(w=>{if(w.length<6)return;const lw=w.toLowerCase();if(seen.has(lw))return;seen.add(lw);

 try{const sr=new SR();sr.lang=({de:'de-DE',en:'en-US',fr:'fr-FR',it:'it-IT',es:'es-ES',ru:'ru-RU'})[spkCode()]||(spkCode()==='auto'?'':spkCode());sr.continuous=true;sr.interimResults=true;let fin=(S.vm&&S.vm.live)?S.vm.live+' ':'';

 let rec;try{rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream)}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){micFail(e2);return}}
 const chunks=[];const M={stream,rec,peak:0,t0:Date.now(),retry:!!retry};MIC=M;M.lim=setTimeout(()=>{if(MIC===M){micStop();toast('Maximale Aufnahmelänge erreicht ('+recLim()/60+' Min.). Die Aufnahme wurde gespeichert.')}},recLim()*1000);

  if(S.vm){if(empty){S.vm.ph='empty'}else{S.vm.ph='done';S.vm.url=URL.createObjectURL(bl);S.vm.blob=bl;S.vm.dur=Math.max(1,(Date.now()-M.t0)/1000);}}micCleanup(true);R();if(S.vm&&S.vm.blob&&sttKey())setTimeout(vTranscribe,50);};
 try{if(MAC){const an=MAC.createAnalyser();an.fftSize=512;const src=MAC.createMediaStreamSource(stream);src.connect(an);M.src=src;const buf=new Uint8Array(an.fftSize);
  const tick=()=>{if(MIC!==M)return;an.getByteTimeDomainData(buf);let m=0;for(const b of buf)m=Math.max(m,Math.abs(b-128));if(m>M.peak)M.peak=m;const el=document.getElementById('lv');if(el)el.style.width=Math.min(100,m*1.6)+'%';M.raf=requestAnimationFrame(tick)};tick();

}

 it:{d:{"Abbrechen": "Annulla", "Ablehnen": "Rifiuta", "Abschliessen": "Concludi", "Adresse des Objekts ergänzen": "Aggiungi l’indirizzo dell’immobile", "Adresse eingeben": "Inserisci l’indirizzo", "Adresse ergänzen": "Aggiungi indirizzo", "Adresse erkannt und übernommen": "Indirizzo riconosciuto e acquisito", "Adresse gespeichert.": "Indirizzo salvato.", "Adresse speichern": "Salva indirizzo", "Adresse ändern": "Modifica indirizzo", "Alles geklärt.": "Tutto chiarito.", "Allgemein": "Generale", "Allgemeine Renovierung": "Ristrutturazione generale", "Als Grundlage übernehmen": "Usa come base", "Am PC geöffnet: gleicher Stand, Offene Punkte in der Seitenleiste.": "Aperto sul PC: stesso stato, punti aperti nella barra laterale.", "Am PC weitermachen (Simulation)": "Continua sul PC (simulazione)", "Anderes Fachgebiet suchen": "Cerca un altro settore", "Anschlussdose": "Presa di collegamento", "Anzahl der Systemtelefone bestätigen": "Conferma il numero dei telefoni di sistema", "Architektur / Planung": "Architettura / progettazione", "Aufzüge": "Ascensori", "Bauleitung": "Direzione lavori", "Auch hier gilt: Das Profil begrenzt nichts.": "Anche qui vale: il profilo non limita nulla.", "Auf dem Handy: Punkt nach links wischen setzt ihn auf „Später“. Am PC: Punkt öffnen und „Später“ wählen.": "Sul telefono: far scorrere un punto verso sinistra lo mette su «Più tardi». Sul PC: apri il punto e scegli «Più tardi».", "Aufnahme läuft": "Registrazione in corso", "Aufnahme beenden": "Termina registrazione", "Aufnahme gespeichert": "Registrazione salvata", "Aufnahme lokal gesichert, Text folgt": "Registrazione salvata in locale, testo in arrivo", "Bau & Handwerk": "Edilizia & artigianato", "Audit abschliessen?": "Concludere il sopralluogo?", "Audit bearbeiten": "Modifica sopralluogo", "Audit lokal gesichert": "Sopralluogo salvato in locale", "Audit pausiert": "Sopralluogo in pausa", "Audit starten": "Avvia sopralluogo", "Fachbereich": "Settore", "Fachbereich ändern": "Cambia settor der App-Sprache ist möglich.":"Можно говорить на другом языке, чем язык приложения.","Offline-Spracherkennung laden?":"Загрузить офлайн-распознавание речи?","Ein Modell für Deutsch, Englisch und Französisch. Danach funktioniert die Erkennung auch ohne Internet.":"Одна модель для немецкого, английского и французского. После этого распознавание работает и без интернета.","Mehrsprachiges Modell":"Многоязычная модель","In der echten App wäre die Spracherkennung jetzt offline verfügbar.":"В настоящем приложении распознавание речи теперь было бы доступно офлайн.","Live-Mitschrift während der Aufnahme":"Живая расшифровка во время записи","Zeigt schon beim Sprechen einen Text an. Diese Erkennung macht das Gerät, sie ist nicht überall verfügbar. Mit OpenAI-Schlüssel kommt der endgültige Text immer von OpenAI.":"Показывает текст уже во время речи. Это распознавание выполняет устройство, оно доступно не везде. С ключом OpenAI окончательный текст всегда приходит от OpenAI.","An":"Вкл.","Aus":"Выкл.","Wird von OpenAI in Text umgewandelt …":"OpenAI преобразует в текст …","Erkannt von OpenAI (du kannst den Text ändern):":"Распознано OpenAI (текст можно изменить):","Erkannt vom Gerät, bitte prüfen (du kannst den Text ändern):":"Распознано устройством, проверьте (текст можно изменить):","Umwandlung nochmals versuchen":"Повторить преобразование","Dein Mikrofon ist aktiv. Nach dem Beenden wandelt OpenAI die Aufnahme automatisch in Text um.":"Микрофон включён. После окончания OpenAI автоматически преобразует запись в текст.","OpenAI hat in der Aufnahme keinen Text erkannt.":"OpenAI не распознал текст в записи.","KI-Kosten":"Расходы на ИИ","Heute":"Сегодня","Dieser Monat":"Этот месяц","Gesamt":"Всего","Letzte 14 Tage":"Последние 14 дней","Pro Audit":"По аудитам","Verbindliche Abrechnung beim Anbieter":"Обязательный расчёт — у провайдера","Claude-Kosten ansehen ↗":"Расходы Claude ↗","OpenAI-Kosten ansehen ↗":"Расходы OpenAI ↗","Übernehmen":"Применить","Zähler zurücksetzen":"Сбросить счёт erungen vorgenommen, die noch nicht gespeichert sind.":"Вы внесли изменения, которые ещё не сохранены.","Weiter bearbeiten":"Продолжить редактирование","Prototyp V#":"Прототип V#","App-Einführung ansehen (# Minute)":"Посмотреть введение в приложение (# минута)","Alle Fachgebiete zeigen":"Показать все специализации","braucht die App einen Claude-Schlüssel. Die Einrichtung ist geführt und dauert etwa # Minuten. Ausprobieren kannst du auch ohne.":"приложению нужен ключ Claude. Настройка пошаговая и занимает около # минут. Попробовать можно и без него.","Keine KI verbunden":"ИИ не подключён","Schritte werden nur gespeichert. Tippen, um die KI zu verbinden.":"Шаги только сохраняются. Нажмите, чтобы подключить ИИ.","Damit die App mitdenkt":"Чтобы приложение думало вместе с вами","Die App erkennt Räume, Mehraufwände und fehlende Angaben automatisch. Dafür braucht sie eine KI.":"Приложение автоматически распознаёт помещения, дополнительные работы и недостающие данные. Для этого ему нужен ИИ.","Einrichten dauert etwa # Minuten. Du brauchst nur eine E-Mail-Adresse.":"Настройка занимает около # минут. Нужен только адрес электронной почты.","Fertig, die KI ist verbunden":"Готово, ИИ подключён","Ab jetzt wertet die App jeden Schritt automatisch aus. Der Schlüssel bleibt nur auf diesem Gerät.":"Теперь приложение автоматически анализирует каждый шаг. Ключ хранится только на этом устройстве.","# Schritte mit Standort":"Шагов с местоположением: #","Wird in der Auswertung separat ausgewiesen.":"Указывается отдельно в анализе.","Der Text nennt besondere Konditionen. Erscheint als Prüfpunkt vor dem Senden.":"В тексте указаны особые условия. Появится как пункт проверки перед отправкой.","Legt unten eine Anfahrtszeile an. Dort die km eintragen.":"Добавляет ниже строку выезда. Укажите там километры.","Währung für alle Beträge:":"Валюта для всех сумм:","(gilt für das ganze Objekt, Änderung unter «Sätze anpassen»)":"(для всего объекта, изменить в «Изменить ставки»)","Preise und Aufwand per function trS(x,L){
 const k=x.replace(/\s+/g,' ').trim();if(!k)return x;
 if(L.d[k]!==undefined)return L.d[k];

 if(k.includes('·')){const parts=k.split(/(\s*·\s*)/);const out=parts.map((q,i)=>i%2||!q.trim()?q:t(q));return out.join('')}
 if(k.includes(', ')&&!/\d{4,}/.test(k)){/* Aufzählung nur, wenn alle Teile bekannt sind */const ps=k.split(', ');if(ps.every(q=>L.d[q]!==undefined||(L.fb&&L.fb[q]!==undefined)))return ps.map(t).join(', ')}
 if(TRKEEP.has(tk))return k;
 /* V131: fehlt der Text in dieser Sprache, übersetzt ihn die KI im Hintergrund; bis dahin Englisch, falls vorhanden */
 trQ(k,tk);
 if(L.fb){if(L.fb[k]!==undefined)return L.fb[k];if(tk!==k&&L.fb[tk]!==undefined)return trFill(L.fb[tk],k)}
 return k;}

mptage commence à la version #.","Claude (Auswertung):":"Claude (analyse) :","OpenAI (Spracherkennung, Auswertung):":"OpenAI (reconnaissance vocale, analyse) :","Letzte # Tage":"# derniers jours","Die Anbieter rechnen in US-Dollar ab. Umrechnung: # USD =":"Les fournisseurs facturent en dollars US. Conversion : # USD =","noch nie":"jamais","Test: Gemeinsame Sicherung über GitHub":"Test : sauvegarde commune via GitHub","Nur für die Testphase":"Uniquement pour la phase de test","# Stände gespeichert":"# points de sauvegarde enregistrés","# Tonaufnahmen":"# enregistrements audio","# MB":"# Mo","Nur für die Testphase.":"Uniquement pour la phase de test.","Alle deine Geräte sichern in dieselbe Datei in einem":"Tous tes appareils sauvegardent dans le même fichier d’un","privaten":"privé","GitHub-Repository. So hast du auf jedem Gerät denselben Inhalt und kannst das Verhalten vergleichen.":"dépôt GitHub. Ainsi tu as le même contenu sur chaque appareil et peux comparer le comportement.","Privates Repository (Besitzer/Name)":"Dépôt privé (propriétaire/nom)","Token (nur für dieses Repository, Contents: Read and write)":"Jeton (uniquement pour ce dépôt, Contents : Read and write)","Name dieses Geräts":"Nom de cet appareil","Einrichten: Auf github.com ein":"Configuration : sur github.com, crée un","privates":"dépôt privé","Repository anlegen (z. B. «audit-backup»). Dann unter Settings › Developer settings › Fine-grained tokens einen Token nur für dieses Repository mit «Contents: Read and write» erstellen. Den Token auf jedem Gerät hier eintragen. Nach der Testphase Token löschen.":"(p. ex. « audit-backup »). Puis, sous Settings › Developer settings › Fine-grained tokens, crée un jeton uniquement pour ce dépôt avec « Contents : Read and write ». Saisis le jeton ici sur chaque appareil. Supprime le jeton après la phase de test.","Tonaufnahmen bleiben nur auf diesem Gerät gespeichert, damit du jederzeit hineinhören kannst. Sie kommen nicht in die Sicherungsdatei. Texte, Fotos und Z utzen?":"Quelle IA veux-tu utiliser ?","Wie lange ist der Schlüssel gültig? (wie bei „Läuft ab“ gewählt)":"Combien de temps la clé est-elle valable ? (comme choisi sous « Expire »)","Wird berechnet …":"Calcul en cours …","Zu Schritt":"À l’étape","Zuletzt geändert":"Dernière modification","Zum Ordnen braucht es mindestens zwei Schritte.":"Pour trier, il faut au moins deux étapes.","Zum Ändern direkt in den Text tippen. «Als OP übernehmen» merkt den Punkt für die Klärung nach dem Audit vor. Er erscheint im Bericht und im Export.":"Pour modifier, touche directement le texte. « Garder comme point ouvert » note le point pour le clarifier après l’audit. Il apparaît dans le rapport et dans l’export.","als offene Punkte vorgemerkt.":"notés comme points ouverts.","gespeichert · Auswertung ausstehend":"enregistré · analyse en attente","gültig bis":"valable jusqu’au","gültig. Die App speichert Schritte weiter, wertet sie aber nicht mehr aus. Tippen, um einen neuen Schlüssel einzurichten.":". L’app continue d’enregistrer les étapes, mais ne les analyse plus. Touche pour configurer une nouvelle clé.","noch nicht ausgewertet.":"pas encore analysées.","offene Punkte, einschliesslich „Später“.":"points ouverts, y compris « Plus tard ».","springen und anpassen ›":"y aller et ajuster ›","unter „Billing“ einen kleinen Betrag auf, # Dollar reichen für viele Audits.":"recharge un petit montant sous « Billing », # dollars suffisent pour de nombreux audits.","wird ausgewertet …":"analyse en cours …","· Begehung":"· Visite","· Claude":"· Claude","· OpenAI":"· OpenAI","· letzter vom":"· dernier du","öffnen ↗":"ouvrir ↗","öffnen“":"ouvrir »","„Copy“":"« Copy »","„Create Key“":"« Create Key »","‹ Zurück zur Anleitung":"‹ Retour aux instructions","⚠ Teures Modell aktiv ·":"⚠ Modèle coûteux actif ·","✓ Claude ist verbunden":"✓ Claude est connecté","✓ KI-Prüfung abgeschlossen · erneut prüfen":"✓ Vérification IA terminée · revérifier","📍 Standort":"📍 Position","Fehlende Texte dieser Sprache übersetzt die KI beim ersten Anzeigen und merkt sie sich auf diesem Gerät.":"Les textes manquants dans cette langue sont traduits par l’IA au premier affichage et mémorisés sur cet appareil.","KI":"IA","Optional":"Facultatif","Oben, direkt über deinen Einträgen, findest du die Knöpfe zum Erfassen:":"En haut, juste au-dessus de tes saisies, tu trouves les boutons de saisie :","Begehung":"Visite","Sprechen und dabei fotografieren, ideal für den Rundgang.":"Parler et photographier en même temps, idéal pour faire le tour.","Sprechen":"Parler","Text":"Texte","Foto":"Photo","Einzelnes Foto, z. B. vom Typenschild.":"Une seule photo, p. ex. de la plaque signalétique.","Die Reihenfolge ist egal. Jede Erfassung wird ein nummerierter Schritt, der neueste steht oben.":"L’ordre n’a pas d’importance. Chaque saisie devient une étape numérotée, la plus récente en haut.","Begehung: sprechen und fotografieren":"Visite : parler et photographier","Die Kamera ist offen und die Aufnahme läuft. Du erzählst, was du siehst, und machst nebenbei Fotos.":"La caméra est ouverte et l’enregistrement tourne. Tu décris ce que tu vois et prends des photos au passage.","Auslöser":"Déclencheur","Foto mit Zeitstempel, passend zur Stelle im Gesprochenen.":"Photo horodatée, associée au moment correspondant de ce que tu dis.","Detail":"Détail","Nahaufnahme mit der Kamera-App, z. B. mit Zoom oder Blitz.":"Gros plan avec l’app appareil photo, p. ex. avec zoom ou flash.","Fertig":"Terminé","Begehung beenden.":"Termine la visite.","Nach # Minuten geht es automatisch im nächsten Schritt weiter. Die Dauer änderst du in den Einstellungen.":"Après # minutes, la suite continue automatiquement dans l’étape suivante. Tu peux changer la durée dans les paramètres.","Danach zeigt jeder Schritt eine Zusammenfassung mit den passenden Fotos. Originaltext und Tonaufnahme kannst du jederzeit aufrufen. Die Tonaufnahme bleibt nur auf deinem Gerät.":"Ensuite, chaque étape affiche un résumé avec les photos correspondantes. Tu peux consulter à tout moment le texte original et l’enregistrement audio. L’enregistrement audio reste uniquement sur ton appareil.","Gehört ein Schritt nicht zum Audit, schlägt sie vor, ihn zu entfernen.":"Si une étape n’a rien à voir avec l’audit, elle propose de la supprimer.","Unterwegs nützlich":"Pratique sur place","Gelände aufzeichnen":"Enregistrer le terrain","Zeichnet deinen Weg auf. Daraus entsteht eine grobe Karte mit Fläche, z. B. für Grundstücke.":"Enregistre ton parcours. Il en résulte une carte approximative avec la surface, p. ex. pour des terrains.","Adresse":"Adresse","Wird beim Bearbeiten aus dem Standort vorgeschlagen und ausgefüllt.":"Proposée et remplie à partir de ta position lors de la modification.","Audits wechseln":"Changer d’audit","Oben rechts wechselst du zwischen deinen Audits.":"En haut à droite, tu passes d’un audit à l’autre.","Unten":"En bas","Offene Punkte, Auswertung und Abschliessen.":"Points ouverts, évaluation et finalisation.","Mit «Bericht senden» gehen Word und Excel zusammen in einer Mail an Backoffice oder Kunde, auch später aus dem abgeschlossenen Audit.":"Avec « Envoyer le rapport », Word et Excel partent ensemble dans un seul e-mail au back-office ou au client, même plus tard depuis l’audit terminé.","Sprechen, fotografieren oder schreiben, in beliebiger Reihenfolge. In der Begehung sprichst und fotografierst du gleichzeitig. Jede Erfassung wird ein nummerierter Schritt.":"Parle, photographie ou écris, dans n’importe quel ordre. Pendant la visite, tu parles et photographies en même temps. Chaque saisie devient une étape numérotée."},"it":{"Prototyp V#":"Prototipo V#","So funktioniert es":"Come funziona","«Audit starten» antippen":"Tocca «Avvia audit»","Gib dem Objekt einen Namen, wenn du magst.":"Dai un nome all’immobile, se vuoi.","Vor Ort erfassen":"Rileva sul posto","Sprechen, fotografieren oder schreiben, in beliebiger Reihenfolge. Jede Erfassung wird ein nummerierter Schritt.":"Parla, fotografa o scrivi, in qualsiasi ordine. Ogni rilevazione diventa un passaggio numerato.","KI erstellt Bericht und Kalkulationsbasis":"L’IA crea rapporto e base di calcolo","Räume, Geräte und Mehraufwand werden erkannt. Du erhältst eine durch KI geschätzte Kalkulationsbasis, die du anpassen, abschliessen und als Excel oder Word teilen kannst.":"Locali, apparecchi e maggior onere vengono riconosciuti. Ricevi una base di calcolo stimata dall’IA, che puoi adattare, concludere e condividere in Excel o Word.","App-Einführung ansehen (# Minute)":"Guarda l’introduzione all’app (# minuto)","Alle Fachgebiete zeigen":"Mostra tutti i settori","Willkommen":"Benvenuto","Du gehst durch ein Objekt und hältst fest, was du siehst. Die App macht daraus einen Bericht und eine durch KI geschätzte Kalkulationsbasis.":"Percorri un immobile e annoti quello che vedi. L’app ne ricava un rapporto e una base di calcolo stimata dall’IA.","Weiter":"Avanti","Überspringen":"Salta","So erfasst du":"Come rilevare","Nach «Audit starten» findest du unten drei Knöpfe:":"Dopo «Avvia audit» trovi in basso tre pulsanti:","Einfach erzählen, die App schreibt mit.":"Racconta e basta, l’app trascrive.","Geräte, Typenschilder, Räume.":"Apparecchi, targhette, locali.","Kurze Notiz tippen.":"Scrivi una breve nota.","Die Reihenfolge ist egal. Jede Erfassung wird ein nummerierter Schritt.":"L’ordine non conta. Ogni rilevazione diventa un passaggio numerato.","Die KI denkt mit":"L’IA ragiona con te","Zu jedem Schritt erkennt die KI Raum, Gerät und Mehraufwand und schlägt Hinweise vor.":"Per ogni passaggio l’IA riconosce locale, apparecchio e maggior onere e propone delle note.","Du prüfst nur noch und korrigierst, wo nötig. Offene Punkte merkst du dir als «OP» für die Klärung nach dem Audit.":"Tu controlli e correggi solo dove serve. I punti aperti li segni come «OP» da chiarire dopo l’audit.","Bericht und Kalkulation":"Rapporto e calcolo","Zum Schluss erhältst du einen Bericht und eine":"Alla fine ricevi un rapporto e una","durch KI geschätzte Kalkulationsbasis":"base di calcolo stimata dall’IA","Prüfen und anpassen":"Controlla e adatta","Mengen, Stunden und Preise korrigierst du direkt in der App.":"Quantità, ore e prezzi li correggi direttamente nell’app.","Wenn alles stimmt, schliesst du das Audit ab. Erst dann wird es zur verbindlichen Grundlage.":"Quando tutto è a posto, concludi l’audit. Solo allora diventa la base vincolante.","Teilen":"Condividi","Als Excel oder Word an Backoffice oder Kunde senden und dort weiterbearbeiten.":"Invia in Excel o Word al back office o al cliente e continua a lavorarci lì.","Damit die KI auswerten kann":"Perché l’IA possa analizzare","braucht die App einen Claude-Schlüssel. Die Einrichtung ist geführt und dauert etwa # Minuten. Ausprobieren kannst du auch ohne.":"l’app ha bisogno di una chiave Claude. La configurazione è guidata e richiede circa # minuti. Puoi anche provare senza.","KI jetzt einrichten":"Configura l’IA ora","Später, zuerst ausprobieren":"Più tardi, prima provo","📍 Gelände aufzeichnen":"📍 Registra il terreno","Keine KI verbunden":"Nessuna IA collegata","Schritte werden nur gespeichert. Tippen, um die KI zu verbinden.":"I passaggi vengono solo salvati. Tocca per collegare l’IA.","Sprich, schreibe oder fotografiere, in beliebiger Reihenfolge. Jede Erfassung wird ein nummerierter Schritt.":"Parla, scrivi o fotografa, in qualsiasi ordine. Ogni rilevazione diventa un passaggio numerato.","Begehung starten":"Avvia sopralluogo","Sprechen und dabei fotografieren":"Parla e fotografa insieme","Damit die App mitdenkt":"Perché l’app ragioni con te","Die App erkennt Räume, Mehraufwände und fehlende Angaben automatisch. Dafür braucht sie eine KI.":"L’app riconosce automaticamente locali, maggior onere e dati mancanti. Per questo le serve un’IA.","Einrichten dauert etwa # Minuten. Du brauchst nur eine E-Mail-Adresse.":"La configurazione richiede circa # minuti. Ti serve solo un indirizzo e-mail.","Jetzt einrichten":"Configura ora","Fertig, die KI ist verbunden":"Fatto,  maggior onere. I modelli più costosi convengono solo in casi eccezionali e poi vanno reimpostati.","Auswertung (Claude)":"Valutazione (Claude)",": Standard, schnell und günstig, ca. # Cent pro Schritt":": standard, veloce ed economico, ca. # centesimi per passaggio",": nur bei sehr kniffligen Fällen, ca. #× teurer":": solo per casi molto difficili, ca. #× più caro",": höchste Qualität, für Audits fast nie nötig, ca. #× teurer":": massima qualità, quasi mai necessaria per gli audit, ca. #× più caro","Spracherkennung (OpenAI)":"Riconoscimento vocale (OpenAI)",": Standard, ca. # Cent pro Minute":": standard, ca. # centesimi al minuto","• Andere Modelle: # bis #× teurer, nur nötig, wenn Fachbegriffe schlecht erkannt werden":"• Altri modelli: da # a #× più cari, servono solo se i termini tecnici vengono riconosciuti male","Aktuell eingestellt":"Impostato ora","Günstige Modelle":"Modelli economici","Auf günstige Modelle umstellen":"Passa ai modelli economici","Bewusst so lassen (Hinweis ausblenden)":"Lascia così di proposito (nascondi avviso)","Farbton #°":"Tonalità #°","nicht angegeben (freiwillig)":"non indicato (facoltativo)","keine geladen":"nessuna scaricata","Live-Mitschrift während der Aufnahme":"Trascrizione dal vivo durante la registrazione","An":"Sì","Aus":"No","Zeigt schon beim Sprechen einen Text an. Diese Erkennung macht das Gerät, sie ist nicht überall verfügbar. Mit OpenAI-Schlüssel kommt der endgültige Text immer von OpenAI.":"Mostra un testo già mentre parli. Questo riconoscimento lo fa il dispositivo, non è disponibile ovunque. Con la chiave OpenAI il testo definitivo arriva sempre da OpenAI.","Maximale Länge einer Aufnahme":"Durata massima di una registrazione","# Min.":"# min.","Bei der Begehung geht es danach nahtlos im nächsten Schritt weiter. Kürzere Aufnahmen sind kleiner und schneller in Text umgewandelt.":"Durante il sopralluogo si prosegue senza interruzioni nel passaggio successivo. Le registrazioni più brevi sono più leggere e si trascrivono
