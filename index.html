</style></head><body><div id="root"><div class="ph" id="ph"></div><aside id="side"></aside></div>
<script>
const VER=83;

const S={loaded:{},spk:'app',srm:false,sc:'start',prof:null,on:true,obs:[],pts:[],vi:0,pi:0,sheet:false,side:true,tab:'open',ex:null,toast:null,pend:[],rec:false,txt:false,room:null,addr:null,adrForm:false,objs:[],audits:[],aid:1,curSt:'open',sig:'',sw:false,vm:null,cfg:false,lang:'de',adrFocus:'a1',pf:[],sug:null,spellOn:true,spell:{},spellAsk:false,cur:{name:defName(),named:false}};
const nextSc=()=>{saveProf();S.pickProf=false;return S.objs.length?'obj':'walk'};
const lastProf=()=>{try{return JSON.parse(localStorage.getItem('aa_prof')||'null')}catch(e){return null}};
function saveProf(){try{if(S.prof)localStorage.setItem('aa_prof',JSON.stringify({p:S.prof,pf:S.pf||[]}))}catch(e){}}
let aidc=1;
const EXTRA=['Vernissage','Kunst','Kunstsammler','Kunstsammlung','Auktion','Auktionshaus','Galerie','Sammlung','Antiquitäten','Antiquariat','Ausstellung','Museum','Archiv','Bibliothek','Restaurator','Restaurierung','Schmuck','Juwelier','Uhren','Weinhandel','Weinkeller','Gastronomie','Hotellerie','Landwirtschaft','Immobilien','Versicherung','Fotografie','Lagerhaltung','Logistik','Vermietung','Denkmalpflege'];
const vocab=()=>{const m=new Map();[...EXTRA,...FIELDS.flatMap(([l,sy])=>[l,...sy.split('|')].flatMap(x=>x.split(/[\s\/\-]+/)))].forEach(w=>{if(w.length>=4){const c=w[0].toUpperCase()+w.slice(1);m.set(norm(c),c)}});return[...m.values()]};
const DICT=['Patchfeld','Lötverteiler','Anschlussdose','Anschlussdosen','Systemtelefone','Systemtelefon','Türsprechstelle','Verkabelung','Neuverkabelung','Verteilerraum','Glasfaser','Holzfenster','Wasserschenkel','Verteiler','Telefone','Modernisierung','Haustür','Eingang','Adresse','Gemälde','Skulptur','Rahmen','Standort','Zustand','Schäden','Fenster','Kupfer','Switch'];
function spellFind(force){if(!S.spellOn&&!force)return[];const out=[],seen=new Set();
 S.obs.forEach(o=>(o.t||'').split(/[^A-Za-zÄÖÜäöüß0-9]+/).forEach(w=>{if(w.length<6)return;const lw=w.toLowerCase();if(seen.has(lw))return;seen.add(lw);
  if(DICT.some(d=>d.toLowerCase()===lw))return;
  const c=DICT.map(d=>[d,lev(lw,d.toLowerCase())]).filter(([d,k])=>d[0].toLowerCase()===lw[0]&&k<=(lw.length>=9?2:1)).sort((x,y)=>x[1]-y[1]);
  if(!c.length||(c[1]&&c[1][1]===c[0][1]))return;out.push([w,c[0][0]])}));return out}
function fixedText(t){const m=new Map(spellFind(true).map(([w,d])=>[w.toLowerCase(),d]));return String(t).replace(/[A-Za-zÄÖÜäöüß0-9]+/g,w=>{const l=w.toLowerCase();return S.spell[l]==='fix'&&m.has(l)?m.get(l):w})}
const isKnown=v=>new Set([...FIELDS.map(f=>f[0]),'Allgemein','Maler','Schreiner','Bodenleger','Dachdecker / Spenglerei','Allgemeine Renovierung'].map(norm)).has(norm(v));
function suggest(t){const n=norm(t);
 if(/kunst|sammlung|auktion|galerie|vernis|antiquit|atelier/.test(n))return['Werk und Künstler','Technik und Masse','Zustand und Schäden','Standort','Herkunft (Provenienz)','Versicherungswert','Rahmen und Verpackung'];
 if(/archiv|bibliothek|museum|buch|buecher/.test(n))return['Titel / Bezeichnung','Zustand und Schäden','Standort / Signatur','Herkunft','Lagerbedingungen','Menge'];
 return['Bezeichnung','Zustand','Standort','Menge','Auffälligkeiten'];}
const missPf=()=>S.pf.filter(f=>{const k=norm(f).split(/[\s\/(]+/)[0];return!S.obs.some(o=>norm([o.t,o.tag,o.an].join(' ')).includes(k))});
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function profsug(){const g=S.sug;return`<div class="hd"><button class="ib" data-a="sugback">‹ Zurück</button><h1>„${esc(g.term)}“</h1></div><div class="bd"><p style="margin-top:0">Diesen Bereich kenne ich noch nicht im Detail. Üblicherweise hält man dort fest:</p>
 <div style="display:flex;flex-wrap:wrap;gap:8px">${g.chips.map((c,i)=>`<button class="chip${c.on?' on':''}" data-a="sugtog" data-v="${i}">${c.on?'✓ ':''}${esc(c.t)}</button>`).join('')}</div>
 <div style="display:flex;gap:8px;margin-top:14px"><input id="sa" class="fi" placeholder="Eigene Angabe hinzufügen" autocomplete="off"><button class="sec" data-a="sugadd">Hinzufügen</button></div>
 <div class="hint" style="margin-top:14px">Das ist ein Vorschlag der KI und keine Fachprüfung. Du kannst alles an- oder abwählen. Die App erfasst auch ohne diese Angaben alles, was du aufnimmst. Fachliche Bewertungen, etwa zu Wert oder Echtheit, trifft sie nicht.</div></div>
 <div style="padding:12px 14px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:8px"><button class="pri" data-a="sugok">Als Grundlage übernehmen</button><button class="sec" data-a="sugskip">Ohne Vorschlag starten</button></div>`;}
const sigNow=()=>JSON.stringify([S.obs,S.pts,S.addr,S.cur.name,S.cur.rt]);
function archive(){const empty=!S.obs.length&&!S.pts.length&&!S.addr&&!S.cur.named;if(empty&&S.curSt!=='done')return;
 const st=(S.curSt==='done'&&S.sig===sigNow())?'done':'open';
 const rec={id:S.aid,name:S.cur.name,named:S.cur.named,rt:S.cur.rt,cc:S.cur.cc,air:S.cur.air,addr:S.addr,prof:S.prof,pf:S.pf,spellOn:S.spellOn,spell:S.spell,obs:S.obs,pts:S.pts,grp:S.grp,room:S.room,vi:S.vi,pi:S.pi,pend:S.pend,st};
 const i=S.audits.findIndex(a=>a.id===S.aid);if(i>=0)S.audits[i]=rec;else S.audits.push(rec);

const RULES=[
 [/^(\d+) Erfassungen$/,(m,t,L)=>L.cap(m[1])],
 [/^(\d+) offene Punkte$/,(m,t,L)=>L.opn(m[1])],
 [/^(Offen|Später|Erledigt|Wichtig|Hinweise ohne Entscheidung|Schreibweise prüfen|Frühere Erfassungen) \((.+)\)$/,(m,t)=>t(m[1])+' ('+t(m[2])+')'],
 [/^Alles ist auf diesem Gerät gesichert: (\d+) Erfassungen und (\d+) offene Punkte, einschliesslich „Später“\.$/,(m,t,L)=>L.saved(m[1],m[2])],
 [/^(\d+) Erfassungen, (\d+) Punkte erledigt, (\d+) mit Kennzeichnung offen\.(?: Die Kalkulation folgt in einer späteren Version\.)?$/,(m,t,L)=>L.sum(m[1],m[2],m[3])],
 [/^Gehört dieses Audit \((.+)\) zu einem Objekt von vorhin oder zu einem neuen\?$/,(m,t,L)=>L.belong(t(m[1]))],
 [/^Meinst du „(.+)“ statt „(.+)“\?$/,(m,t,L)=>L.mean(m[1],m[2])],
 [/^Objekt erkannt: (.+)$/,(m,t,L)=>L.objrec+t(m[1])],
 [/^„Bin angekommen beim (.+)\.“$/,(m,t,L)=>L.arrived(t(m[1]))],
 [/^Adresse gespeichert: (.+)$/,(m,t,L)=>L.adrsaved+m[1]],
 [/^Deine Entscheidung: (.+)$/,(m,t,L)=>L.yourdec+t(m[1])],
 [/^Deine Angabe: (.+) \(bleibt unverändert gespeichert\)$/,(m,t,L)=>L.yourent+t(m[1])+L.kept],
 [/^Gruppe: (.+)$/,(m,t,L)=>L.group+t(m[1])],
 [/^(erkannt|vermutlich): (.+)$/,(m,t,L)=>(m[1]==='erkannt'?L.rec:L.prob)+m[2].split(', ').map(t).join(', ')],
 [/^Ist das (.+)\? Bitte kurz bestätigen$/,(m,t,L)=>L.isthis(t(m[1]))],
 [/^(.+) \(vermutet\)$/,(m,t,L)=>t(m[1])+L.presumed],
 [/^Angabe fehlt: (.+)$/,(m,t,L)=>L.missing+t(m[1])],
 [/^auch: (.+)$/,(m,t,L)=>L.also+m[1]],
 [/^(.+) ✎$/,(m,t)=>t(m[1])+' ✎'],
 [/^✓ (.+)$/,(m,t)=>'✓ '+t(m[1])],
 [/^Schreibweise nur in der Zusammenfassung angepasst: (.+)\. Der Rohtext ist unverändert gespeichert\.$/,(m,t,L)=>L.spell(m[1])],
 [/^Sprachpaket „(.+)“ würde jetzt geladen\. Im Prototyp nicht enthalten\.$/,(m,t,L)=>L.pack(m[1])]
];
function trS(x,L){
 const k=x.replace(/\s+/g,' ').trim();if(!k)return x;
 if(L.d[k]!==undefined)return L.d[k];
 const t=y=>trS(y,L);
 for(const [re,fn] of RULES){const m=k.match(re);if(m)return fn(m,t,L)}
 if(k.includes('·')){const parts=k.split(/(\s*·\s*)/);const out=parts.map((q,i)=>i%2||!q.trim()?q:t(q));return out.join('')}
 if(k.includes(', ')&&!/\d{4,}/.test(k)){/* Aufzählung nur, wenn alle Teile bekannt sind */const ps=k.split(', ');if(ps.every(q=>L.d[q]!==undefined))return ps.map(t).join(', ')}
 return k;}
function trText(n){const par=n.parentElement;if(!par||par.closest('[data-nt],textarea,script,style'))return;const o=n.nodeValue;const m=o.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return;const r=trS(m[2],curLP());if(r!==m[2].replace(/\s+/g,' ').trim()||m[2]!==m[2].replace(/\s+/g,' '))n.nodeValue=m[1]+r+m[3];}
function trAttrs(e){if(e.closest&&e.closest('[data-nt]'))return;['placeholder','aria-label','title'].forEach(k=>{const v=e.getAttribute&&e.getAttribute(k);if(v){const r=trS(v,curLP());if(r!==v)e.setAttribute(k,r)}})}
function applyTr(root){if(S.lang==='de')return;
 if(root.nodeType===3){trText(root);return}
 if(root.nodeType!==1)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const L=[];while(n=w.nextNode())L.push(n);L.forEach(trText);
 trAttrs(root);root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(trAttrs);}
new MutationObserver(ms=>{if(S.lang==='de')return;ms.forEach(m=>m.addedNodes.forEach(applyTr))}).observe(document.getElementById('root'),{childList:true,subtree:true});

function imgKey(u){let h=5381;for(let i=0;i<u.length;i+=7)h=((h<<5)+h+u.charCodeAt(i))|0;return'i'+u.length+'_'+(h>>>0)}
function imgPut(k,u){if(IMGSAVED.has(k)||IMGPEND.has(k))return;IMGPEND.add(k);idb().then(d=>{const t=d.transaction('i','readwrite');t.objectStore('i').put(u,k);t.oncomplete=()=>{IMGPEND.delete(k);IMGSAVED.add(k);saveErr(false)};t.onerror=t.onabort=()=>{IMGPEND.delete(k);saveErr(true)}}).catch(()=>{IMGPEND.delete(k);saveErr(true)})}
function imgGet(k){return idb().then(d=>new Promise((ok,no)=>{const r=d.transaction('i').objectStore('i').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
