 fr:{d:{"Sprich, schreibe oder fotografiere, in beliebiger Reihenfolge. Jede Erfassung wird ein nummerierter Schritt.": "Parle, écris ou photographie, dans n’importe quel ordre. Chaque saisie devient une étape numérotée.", "Abbrechen": "Annuler", "Ablehnen": "Refuser", "Abschliessen": "Terminer", "Adresse des Objekts ergänzen": "Ajouter l’adresse de l’objet", "Adresse eingeben": "Saisir l’adresse", "Adresse ergänzen": "Ajouter l’adresse", "Adresse erkannt und übernommen": "Adresse reconnue et reprise", "Adresse gespeichert.": "Adresse enregistrée.", "Adresse speichern": "Enregistrer l’adresse", "Adresse ändern": "Modifier l’adresse", "Alles geklärt.": "Tout est clarifié.", "Allgemein": "Général", "Allgemeine Renovierung": "Rénovation générale", "Als Grundlage übernehmen": "Utiliser comme base", "Am PC geöffnet: gleicher Stand, Offene Punkte in der Seitenleiste.": "Ouvert sur le PC : même état, points ouverts dans la barre latérale.", "Am PC weitermachen (Simulation)": "Continuer sur le PC (simulation)", "Anderes Fachgebiet suchen": "Chercher un autre domaine", "Anschlussdose": "Prise de raccordement", "Anzahl der Systemtelefone bestätigen": "Confirmer le nombre de téléphones système", "Architektur / Planung": "Architecture / planification", "Aufzüge": "Ascenseurs", "Bauleitung": "Direction des travaux", "Auch hier gilt: Das Profil begrenzt nichts.": "Ici aussi : le profil ne limite rien.", "Auf dem Handy: Punkt nach links wischen setzt ihn auf „Später“. Am PC: Punkt öffnen und „Später“ wählen.": "Sur le téléphone : glisser un point vers la gauche le met sur « Plus tard ». Sur le PC : ouvrir le point et choisir « Plus tard ».", "Aufnahme läuft": "Enregistrement en cours", "Aufnahme beenden": "Arrêter l’enregistrement", "Aufnahme gespeichert": "Enregistrement sauvegardé", "Aufnahme lokal gesichert, Text folgt": "Enregistrement sauvegardé localement, texte à suivre", "Bau & Handwerk": "Construction & artisanat", "Audit abschliessen?": "Terminer la visite ?", "Audit bearbeiten": "Modifier la visite", "Audit lokal gesichert": "Visite sauvegardée localement", "Audit pausiert": "Visite en pause", "Audit starten": "Démarrer la visite", "Fachbereich": "Domaine", "Fachbereich ändern": "Changer de domaine", "Fachbereich wählen": "Choisir le domaine", "Letzte Audits": "Visites récentes", "Alle Audits": "Toutes les visites", "Noch keine Audits gespeichert.": "Aucune visite enregistrée.", "○ Keine KI verbunden": "○ Aucune IA connectée", "Ohne Schlüssel funktionieren Erfassen und Aufnehmen, die automatische Auswertung aber nicht.": "Sans clé, la saisie et l’enregistrement fonctionnent, mais pas l’analyse automatique.", "✓ KI ist aktiv": "✓ L’IA est active", "Die App wertet deine Audits automatisch aus.": "L’app analyse tes visites automatiquement.", "✕ Schlüssel abgelaufen": "✕ Clé expirée", "Bitte einen neuen Schlüssel einrichten.": "Merci de configurer une nouvelle clé.", "! KI antwortet nicht": "! L’IA ne répond pas", "Die letzte Anfrage ist fehlgeschlagen.": "La dernière requête a échoué.", "✓ KI ist aktiv, Schlüssel läuft bald ab": "✓ L’IA est active, la clé expire bientôt", "Ablaufdatum nicht hinterlegt": "Date d’expiration non renseignée", "Gültigkeit des Schlüssels (wie beim Anbieter unter „Läuft ab“ gewählt)": "Validité de la clé (comme choisie chez le fournisseur sous « Expire »)", "Nicht gespeichert": "Non enregistré", "Audits": "Visites", "Bodenleger": "Poseur de sols", "Cat5 behalten": "Garder Cat5", "Cat5-Angabe fachlich prüfen": "Vérifier techniquement l’indication Cat5", "Dachdecker / Spenglerei": "Couvreur / ferblanterie", "Das ist ein Vorschlag der KI und keine Fachprüfung. Du kannst alles an- oder abwählen. Die App erfasst auch ohne diese Angaben alles, was du aufnimmst. Fachliche Bewertungen, etwa zu Wert oder Echtheit, trifft sie nicht.": "Ceci est une suggestion de l’IA, pas une expertise. Tu peux tout cocher ou décocher. L’application enregistre tout ce que tu saisis, même sans ces indications. Elle ne donne aucune éva const RULES=[
 [/^(\d+) Erfassungen$/,(m,t,L)=>L.cap(m[1])],
 [/^(\d+) offene Punkte$/,(m,t,L)=>L.opn(m[1])],
 [/^(Offen|Später|Erledigt|Wichtig|Hinweise ohne Entscheidung|Schreibweise prüfen|Frühere Erfassungen) \((.+)\)$/,(m,t)=>t(m[1])+' ('+t(m[2])+')'],
 [/^Alles ist auf diesem Gerät gesichert: (\d+) Erfassungen und (\d+) offene Punkte, einschliesslich „Später“\.$/,(m,t,L)=>L.saved(m[1],m[2])],
 [/^(\d+) Erfassungen, (\d+) Punkte erledigt, (\d+) mit Kennzeichnung offen\.(?: Die Kalkulation folgt in einer späteren Version\.)?$/,(m,t,L)=>L.sum(m[1],m[2],m[3])],
 [/^Gehört dieses Audit \((.+)\) zu einem Objekt von vorhin oder zu einem neuen\?$/,(m,t,L)=>L.belong(t(m[1]))],
 [/^Meinst du „(.+)“ statt „(.+)“\?$/,(m,t,L)=>L.mean(m[1],m[2])],
 [/^Objekt erkannt: (.+)$/,(m,t,L)=>L.objrec+t(m[1])],
 [/^„Bin angekommen beim (.+)\.“$/,(m,t,L)=>L.arrived(t(m[1]))],
 [/^Adresse gespeichert: (.+)$/,(m,t,L)=>L.adrsaved+m[1]],
 [/^Deine Entscheidung: (.+)$/,(m,t,L)=>L.yourdec+t(m[1])],
 [/^Deine Angabe: (.+) \(bleibt unverändert gespeichert\)$/,(m,t,L)=>L.yourent+t(m[1])+L.kept],
 [/^Gruppe: (.+)$/,(m,t,L)=>L.group+t(m[1])],
 [/^(erkannt|vermutlich): (.+)$/,(m,t,L)=>(m[1]==='erkannt'?L.rec:L.prob)+m[2].split(', ').map(t).join(', ')],
 [/^Ist das (.+)\? Bitte kurz bestätigen$/,(m,t,L)=>L.isthis(t(m[1]))],
 [/^(.+) \(vermutet\)$/,(m,t,L)=>t(m[1])+L.presumed],
 [/^Angabe fehlt: (.+)$/,(m,t,L)=>L.missing+t(m[1])],
 [/^auch: (.+)$/,(m,t,L)=>L.also+m[1]],
 [/^(.+) ✎$/,(m,t)=>t(m[1])+' ✎'],
 [/^✓ (.+)$/,(m,t)=>'✓ '+t(m[1])],
 [/^Schreibweise nur in der Zusammenfassung angepasst: (.+)\. Der Rohtext ist unverändert gespeichert\.$/,(m,t,L)=>L.spell(m[1])],
 [/^Sprachpaket „(.+)“ würde jetzt geladen\. Im Prototyp nicht enthalten\.$/,(m,t,L)=>L.pack(m[1])]
];
function trS(x,L){
 const k=x.replace(/\s+/g,' ').trim();if(!k)return x;
 if(L.d[k]!==undefined)return L.d[k];
 const t=y=>trS(y,L);
 for(const [re,fn] of RULES){const m=k.match(re);if(m)return fn(m,t,L)}
 if(k.includes('·')){const parts=k.split(/(\s*·\s*)/);const out=parts.map((q,i)=>i%2||!q.trim()?q:t(q));return out.join('')}
 if(k.includes(', ')&&!/\d{4,}/.test(k)){/* Aufzählung nur, wenn alle Teile bekannt sind */const ps=k.split(', ');if(ps.every(q=>L.d[q]!==undefined))return ps.map(t).join(', ')}
 return k;}
function trText(n){const par=n.parentElement;if(!par||par.closest('[data-nt],textarea,script,style'))return;const o=n.nodeValue;const m=o.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return;const r=trS(m[2],curLP());if(r!==m[2].replace(/\s+/g,' ').trim()||m[2]!==m[2].replace(/\s+/g,' '))n.nodeValue=m[1]+r+m[3];}
function trAttrs(e){if(e.closest&&e.closest('[data-nt]'))return;['placeholder','aria-label','title'].forEach(k=>{const v=e.getAttribute&&e.getAttribute(k);if(v){const r=trS(v,curLP());if(r!==v)e.setAttribute(k,r)}})}
function applyTr(root){if(S.lang==='de')return;
 if(root.nodeType===3){trText(root);return}
 if(root.nodeType!==1)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const L=[];while(n=w.nextNode())L.push(n);L.forEach(trText);
 trAttrs(root);root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(trAttrs);}
new MutationObserver(ms=>{if(S.lang==='de')return;ms.forEach(m=>m.addedNodes.forEach(applyTr))}).observe(document.getElementById('root'),{childList:true,subtree:true});

const IMGSAVED=new Set(),IMGPEND=new Set();let IDBP=null;
function idb(){if(IDBP)return IDBP;IDBP=new Promise((ok,no)=>{try{const q=indexedDB.open('aa_img',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}});return IDBP}
function imgKey(u){let h=5381;for(let i=0;i<u.length;i+=7)h=((h<<5)+h+u.charCodeAt(i))|0;return'i'+u.length+'_'+(h>>>0)}
function imgPut(k,u){if(IMGSAVED.has(k)||IMGPEND.has(k))return;IMGPEND.add(k);idb().then(d=>{const t=d.transaction('i','readwrite');t.objectStore('i').put(u,k);t.oncomplete=()=>{IMGPEND.delete(k);IMGSAVED.add(k);saveErr(false)};t.onerror=t.onabort=()=>{IMGPEND.delete(k);saveErr(true)}}).catch(()=>{IMGPEND.delete(k);saveErr(true)})}
function imgGet(k){return idb().then(d=>new Promise((ok,no)=>{const r=d.transaction('i').objectStore('i').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
